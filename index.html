let lang = (() => {
  const saved = localStorage.getItem('cv-lang');
  if (saved === 'zh' || saved === 'en') return saved;
  return (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
})();

const L = v => (v && typeof v === 'object' && !Array.isArray(v) && ('zh' in v || 'en' in v)) ? (v[lang] ?? v.zh ?? '') : (v ?? '');
const T = k => (ui[lang] && ui[lang][k] !== undefined) ? ui[lang][k] : (ui.zh[k] ?? '');
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 标签：支持纯字符串（不翻译）与 {zh,en} */
const tagHtml = t => `<span class="tag">${L(t)}</span>`;
const tagAccentHtml = t => `<span class="tag tag-accent">${L(t)}</span>`;
const tagsHtml = arr => `<div class="tags">${(arr || []).map(tagHtml).join('')}</div>`;
const linkHtml = l => l.url
  ? `<a class="link-chip" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)} &#8599;</a>`
  : `<span class="link-chip pending">${esc(l.label)} · ${esc(T('linkPending'))}</span>`;

/* --- 空数据章节自动隐藏，并重排可见章节编号 -------------------------------
   例：原简历未提供会议报告（talks 为空），该章节隐藏且后续编号自动补位。
   补入数据后刷新页面即可恢复显示，无需改动 HTML。 */
function syncSections(){
  const counts = {
    summary: cvData.summary.length, experience: cvData.experience.length,
    education: cvData.education.length, publications: cvData.publications.length,
    patents: cvData.patents.length, skills: cvData.skills.length,
    projects: cvData.projects.length, talks: cvData.talks.length,
    awards: cvData.awards.length, contact: 1
  };
  let n = 0;
  sections.forEach(s => {
    const el = document.getElementById('sec-' + s.id);
    if (!el) return;
    el.hidden = !counts[s.id];
    if (counts[s.id]) s.num = String(++n).padStart(2, '0');
  });
}

function renderSectionHeads(){
  document.querySelectorAll('[data-sec]').forEach(el => {
    const s = sections.find(x => x.id === el.dataset.sec);
    if (!s) return;
    el.innerHTML = `<span class="sec-num">${s.num}</span>
      <div class="sec-titles"><p class="kicker">${L(s.kicker)}</p><h2 class="sec-title">${L(s.title)}</h2></div>
      ${L(s.note) ? `<span class="sec-note">${L(s.note)}</span>` : ''}`;
  });
}

/* --- 04 论文 --- */

  const badge = t => t === 'first'
    ? `<span class="badge badge-first">${T('firstAuthor')}</span>`
    : t === 'co' ? `<span class="badge badge-co">${T('coFirst')}</span>`
    : `<span class="badge badge-plain">${T('coAuthor')}</span>`;
  $('#body-publications').innerHTML = cvData.publications.map((p, i) => `
    <article class="list-row">
      <span class="list-n">${String(i + 1).padStart(2,'0')}</span>
      <div>
        <div class="pub-meta">${badge(p.type)}<span class="pub-journal">${esc(p.journal)}</span>
          <span class="muted" style="font-size:12px">${esc(p.year)}</span></div>
        <h3 class="pub-title">${L(p.title)}</h3>
        <p class="pub-authors">${esc(p.authors)}</p>
        <p class="pub-note">${L(p.note)}</p>
        <div class="row" style="gap:14px;margin-top:9px">${(p.links || []).map(linkHtml).join('')}</div>
      </div>
    </article>`).join('') +
    `<p class="pub-note" style="margin:14px 0 0;padding-top:10px;border-top:1px dashed var(--line)"><span class="small-label">${T('paperNote')} · </span>${L(cvData.publicationsNote)}</p>`;
}

/* --- 10 联系 --- */
function renderContact(){
  const c = cvData.contact;
  /* 可选字段：原简历未提供即不渲染，避免出现 undefined / 空行 */
  const item = (k, v) => v ? `<div class="contact-item"><span class="contact-k">${k}</span><span class="contact-v">${v}</span></div>` : '';
  const rows = [
    item('E-mail', `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`),
    item('Tel.', esc(c.phone)),
    item('WeChat', c.wechat ? L(c.wechat) : ''),
    item('Location', L(c.location)),
    item(T('languages'), c.languages ? L(c.languages) : ''),
    /* 国际简历惯例：出生日期不在英文版展示，避免年龄相关信息 */
    item(T('dob'), c.dob && lang === 'zh' ? esc(c.dob) : ''),
    item('ORCID', c.orcid ? `<a href="https://orcid.org/${esc(c.orcid)}" target="_blank" rel="noopener noreferrer">${esc(c.orcid)}</a>` : ''),
    item('Scholar', c.scholar ? `<a href="${esc(c.scholar)}" target="_blank" rel="noopener noreferrer">Google Scholar &#8599;</a>` : ''),
    item('GitHub', c.github ? `<a href="${esc(c.github)}" target="_blank" rel="noopener noreferrer">${esc(c.github)}</a>` : '')
  ].join('');
  $('#body-contact').innerHTML = `<div class="g2" style="grid-template-columns:1.1fr .9fr;gap:24px">
    <div class="contact-card">${rows}</div>
    <div class="stack" style="gap:16px">
      <div class="contact-note">${L(c.note)}</div>
      <div><p class="small-label" style="margin-bottom:10px">${T('contactOpen')}</p>
        <div class="tags">${c.open.map(tagAccentHtml).join('')}</div></div>
      <div class="row no-print" style="gap:10px;margin-top:4px">
        <a class="btn btn-solid" href="mailto:${esc(c.email)}?subject=${encodeURIComponent('CV / 简历交流')}">${T('contactCta')}</a>
        <button type="button" class="btn btn-quiet" id="btnPdf3">${T('pdf')}</button>
      </div>
    </div>
  </div>`;
  const b = $('#btnPdf3'); if (b) b.addEventListener('click', handlePdf);
}

function renderAll(){
  syncSections();
  renderSectionHeads(); renderChrome(); renderHeroMetrics();
  renderSummary(); renderExperience(); renderEducation(); renderPublications();
  renderPatents(); renderSkills(); renderProjects(); renderTalks(); renderAwards(); renderContact();
}

/* ==========================================================================
   E. 交互：语言切换 / PDF / 导航 / 平滑滚动降级
   ========================================================================== */
function setLang(next){
  if (next === lang) return;
  lang = next;
  localStorage.setItem('cv-lang', lang);
  renderAll();
}

function handlePdf(){
  if (cfg.pdfUrl){
    const a = document.createElement('a');
    a.href = cfg.pdfUrl; a.download = cfg.pdfFileName;
    document.body.appendChild(a); a.click(); a.remove();
  } else {
    window.print();   /* 浏览器打印 → 目标选择「另存为 PDF」→ 自动套用精简单页样式 */
  }
}

function bind(){
  $('#btnZH').addEventListener('click', () => setLang('zh'));
  $('#btnEN').addEventListener('click', () => setLang('en'));
  ['#btnPdf','#btnPdf2'].forEach(id => $(id).addEventListener('click', handlePdf));
  $('#demoClose').addEventListener('click', () => { $('#demoNote').hidden = true; });

  const menu = $('#mobileMenu'), menuBtn = $('#btnMenu');
  menuBtn.addEventListener('click', () => {
    menu.hidden = !menu.hidden;
    menuBtn.setAttribute('aria-expanded', String(!menu.hidden));
  });
  menu.addEventListener('click', e => {
    if (e.target.tagName === 'A'){ menu.hidden = true; menuBtn.setAttribute('aria-expanded','false'); }
  });

  const top = $('#toTop');
  top.addEventListener('click', () => window.scrollTo({top:0,behavior:'smooth'}));
  window.addEventListener('scroll', () => top.classList.toggle('show', window.scrollY > 620), {passive:true});
}

/* 章节高亮（功能性反馈，非装饰动画） */
let navObserver = null;
function observeNav(){
  if (navObserver) navObserver.disconnect();
  if (!('IntersectionObserver' in window)) return;
  navObserver = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      document.querySelectorAll('.nav-link').forEach(a => a.classList.toggle('active', a.dataset.nav === en.target.dataset.navKey));
    });
  }, {rootMargin:'-20% 0px -70% 0px', threshold:0});
  document.querySelectorAll('#sec-summary,#sec-experience,#sec-publications,#sec-projects,#sec-contact').forEach(el => {
    el.dataset.navKey = el.id.replace('sec-','');
    navObserver.observe(el);
  });
}

bind();
renderAll();
</script>
